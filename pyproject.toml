[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-lk"
version = "2.0.0"
description = "Reliable Sri Lankan weather collection and reporting pipeline"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["camelot-py==2.0.0"]
charts = ["matplotlib==3.10.8"]
browser = ["selenium==4.34.2"]
archives = ["googlesearch-python==1.3.0"]
maintenance = ["googlemaps==4.10.0", "fuzzywuzzy==0.18.0"]
dev = ["pytest==8.4.2"]

[project.scripts]
weather-lk = "weather_lk.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["weather_utils"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
weather_lk = ["stations/data/*.json", "storage/migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live: opt-in tests that access external services"]
addopts = "-m 'not live'"
