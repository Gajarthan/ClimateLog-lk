name: Weather pipeline
# A persistent, explicitly configured host is required. No schedule is enabled.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weather-pipeline
  cancel-in-progress: false
jobs:
  collect:
    runs-on: [self-hosted, weather-pipeline]
    env:
      WEATHER_DATA_DIR: ${{ vars.WEATHER_DATA_DIR }}
      WEATHER_PUBLIC_DATA_URL: ${{ vars.WEATHER_PUBLIC_DATA_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require durable storage outside the checkout
        shell: python
        run: |
          import os
          from pathlib import Path
          value = os.environ.get('WEATHER_DATA_DIR')
          if not value or not Path(value).is_absolute():
              raise SystemExit('Set WEATHER_DATA_DIR to an absolute path on persistent local disk')
          if Path(value).resolve().is_relative_to(Path.cwd().resolve()):
              raise SystemExit('Persistent storage must be outside the checkout')
      - run: python -m pip install -r requirements.txt
      - run: python -m weather_lk run
      - name: Back up accepted observations and sources
        if: always()
        run: python -m weather_lk backup
